<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteios | Trampos do Bigode</title>
    <style>
        :root { --bg: #0a0a0a; --card: #141414; --red: #ff2e2e; --text: #ffffff; --green: #00e676; --border: #333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { max-width: 450px; width: 100%; background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 20px; }

        header { text-align: center; margin-bottom: 25px; }
        h1 { color: var(--red); font-size: 24px; margin-bottom: 5px; }
        
        label { display: block; margin-top: 15px; font-size: 13px; color: #ccc; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid var(--border); background: #000; color: white; }
        
        .total-box { background: #000; border: 1px solid var(--border); padding: 15px; border-radius: 10px; margin-top: 20px; display: flex; justify-content: space-between; align-items: center; }
        .total-valor { font-size: 20px; color: var(--green); font-weight: bold; }

        .btn-participar { display: block; width: 100%; background: var(--red); color: white; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 25px; text-decoration: none; text-align: center; box-shadow: 0 4px 15px rgba(255, 46, 46, 0.3); }
        .btn-voltar { display: block; text-align: center; margin-top: 20px; color: #666; font-size: 12px; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Nossos Sorteios</h1>
        </header>

        <form id="formSorteio" onsubmit="enviarSorteio(event)">
            <label>Selecione o Sorteio:</label>
            <select id="tipoSorteio" onchange="calcularTotal()">
                <option value="1000">Sorteio R$ 1.000,00 (R$ 5/número)</option>
                <option value="ifood">Saldo iFood (R$ 1/número)</option>
            </select>

            <label>Seu Nome Completo:</label>
            <input type="text" id="nome" class="campo-input" placeholder="Digite seu nome..." required>

            <label>Seu WhatsApp:</label>
            <input type="text" id="contato" class="campo-input" placeholder="(00) 00000-0000" required>

            <label>Quantidade de números:</label>
            <input type="number" id="quantidade" class="campo-input" min="1" value="1" oninput="calcularTotal()" required>

            <div class="total-box">
                <span>Valor Total:</span>
                <span class="total-valor" id="totalValor">R$ 5,00</span>
            </div>

            <button type="submit" class="btn-participar">RESERVAR NÚMEROS</button>
        </form>

        <a href="index.html" class="btn-voltar">← Voltar para o Painel</a>
    </div>

    <script>
        function calcularTotal() {
            let tipo = document.getElementById('tipoSorteio').value;
            let qtd = document.getElementById('quantidade').value;
            let preco = (tipo === 'ifood') ? 1 : 5;
            let total = qtd * preco;
            document.getElementById('totalValor').innerText = "R$ " + total.toFixed(2).replace('.', ',');
        }

        function enviarSorteio(event) {
            event.preventDefault();
            let tipo = document.getElementById('tipoSorteio').options[document.getElementById('tipoSorteio').selectedIndex].text;
            let nome = document.getElementById('nome').value;
            let contato = document.getElementById('contato').value;
            let qtd = document.getElementById('quantidade').value;
            let valorTotal = document.getElementById('totalValor').innerText;

            let mensagem = `Olá Bigode! Quero participar do sorteio: ${tipo}.
            *Nome:* ${nome}
            *Contato:* ${contato}
            *Quantidade:* ${qtd} números
            *Valor total:* ${valorTotal}`;

            window.open("https://wa.me/5532987194791?text=" + encodeURIComponent(mensagem), '_blank');
        }
    </script>
</body>
</html>
