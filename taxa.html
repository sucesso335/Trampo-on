<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trampos do Bigode | Centro de Trampos</title>
    <style>
        :root { --bg: #0a0a0a; --card: #141414; --red: #ff2e2e; --text: #ffffff; --green: #00e676; }
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { max-width: 400px; width: 100%; background: var(--card); border: 1px solid #333; padding: 25px; border-radius: 20px; }
        
        h2 { text-align: center; color: var(--red); margin-bottom: 25px; font-size: 22px; }
        label { display: block; margin-top: 15px; font-size: 13px; color: #ccc; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #444; background: #000; color: white; }
        
        button { width: 100%; padding: 15px; background: var(--red); color: white; border: none; border-radius: 10px; margin-top: 25px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(255, 46, 46, 0.3); }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        
        #resultado { margin-top: 25px; padding: 20px; background: #1a1a1a; border-radius: 12px; border: 1px solid #444; display: none; text-align: center; }
        .btn-acao { display:block; margin-top:15px; padding:12px; background:var(--green); color:black; text-decoration:none; font-weight:bold; border-radius:8px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Centro de Trampos</h2>
    
    <label>Nome Completo</label>
    <input type="text" id="nome" placeholder="Seu nome">

    <label>Selecione o Serviço</label>
    <select id="servico">
        <option value="Trampo Koin">Trampo Koin</option>
        <option value="Indicação">Indicação (Ganhe R$ 200)</option>
        <option value="Volta Limite">Volta Limite</option>
    </select>

    <label>Banco</label>
    <input type="text" id="banco" placeholder="Ex: Nubank, Inter...">

    <label>Sua Chave PIX</label>
    <input type="text" id="pix" placeholder="Digite sua chave PIX">

    <button id="btn-processar" onclick="processar()">PROCESSAR TRAMPO</button>

    <div id="resultado">
        <p id="msg-resultado" style="line-height: 1.5;"></p>
        <a id="btn-acao" href="#" class="btn-acao">CONTINUAR</a>
    </div>

    <a href="index.html" style="display:block; text-align:center; color:#666; margin-top:25px; font-size: 12px; text-decoration: none;">← Voltar ao início</a>
</div>

<script>
    function processar() {
        const nome = document.getElementById('nome').value;
        const servico = document.getElementById('servico').value;
        const banco = document.getElementById('banco').value;
        const pix = document.getElementById('pix').value;
        const btn = document.getElementById('btn-processar');
        
        if(!nome || !pix || !banco) { alert("Preencha todos os campos!"); return; }

        btn.innerText = "PROCESSANDO...";
        btn.disabled = true;

        setTimeout(() => {
            const resDiv = document.getElementById('resultado');
            const msg = document.getElementById('msg-resultado');
            const btnAcao = document.getElementById('btn-acao');
            
            resDiv.style.display = 'block';
            btn.innerText = "PROCESSAR TRAMPO";
            btn.disabled = false;

            let textoMsg = `Olá Bigode! Meu nome é ${nome}. Quero realizar o serviço: ${servico}. Banco: ${banco}. Chave PIX: ${pix}.`;
            
            if(servico === 'Trampo Koin') {
                msg.innerHTML = "Trampo Koin registrado.<br>Fale com o ADM para finalizar.";
                btnAcao.innerText = "CHAMAR ADM NO WHATSAPP";
            } 
            else if(servico === 'Indicação') {
                msg.innerHTML = "Indicação registrada!<br>Você receberá R$ 200,00 no PIX.";
                btnAcao.innerText = "CONFIRMAR RECEBIMENTO";
            } 
            else if(servico === 'Volta Limite') {
                msg.innerHTML = "Solicitação de Volta Limite enviada.<br>Aguarde a análise da equipe.";
                btnAcao.innerText = "FALAR NO WHATSAPP";
            }
            
            btnAcao.href = "https://wa.me/5532987252649?text=" + encodeURIComponent(textoMsg);
        }, 1500);
    }
</script>

</body>
</html>
