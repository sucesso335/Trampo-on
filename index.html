<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trampos do Bigode</title>
    <style>
        :root { --bg: #0a0a0a; --card: #141414; --red: #ff2e2e; --text: #ffffff; }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 450px; width: 100%; }
        
        .hero { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--red); text-align: center; margin-bottom: 20px; }
        .timer-box { font-size: 2em; color: var(--red); font-weight: bold; margin: 10px 0; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid #333; text-decoration: none; color: white; display: flex; align-items: center; gap: 10px; }
        
        /* Notificação de compra */
        #live-sale { background: #1a1a1a; padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 15px; border: 1px solid #444; color: #00e676; text-align: center; }
        
        .adm-box { background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid #333; display: flex; align-items: center; gap: 15px; margin-top: 20px; text-decoration: none; color: white; }
        .adm-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        
        .comment { background: var(--card); padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 12px; border-left: 3px solid var(--red); transition: opacity 0.5s; }
    </style>
</head>
<body>

<div class="container">
    <div id="live-sale">Alguém de São Paulo acabou de solicitar um trampo!</div>

    <div class="hero">
        <img src="F7475BA1-883F-4030-94F1-18ACE3840245.jpeg" style="width: 120px; border-radius: 10px;">
        <h2 style="margin: 10px 0;">Desconto de 10% liberado!</h2>
        <div class="timer-box" id="timer">03:00</div>
        <p style="font-size: 12px; color: #888;">Escolha seu trampo e ganhe o desconto agora.</p>
    </div>

    <div class="grid">
        <a href="contas.html" class="card">🏛️ <h3>Contas</h3></a>
        <a href="cartao.html" class="card">💳 <h3>Cartão</h3></a>
        <a href="emprestimo.html" class="card">💰 <h3>Crédito</h3></a>
        <a href="taxa.html" class="card">🛡️ <h3>Sem Taxa</h3></a>
    </div>

    <a href="https://wa.me/5532987194791" class="adm-box">
        <img src="IMG_5968.png" class="adm-img">
        <div><strong>Falar com ADM</strong><br><span style="color: #00e676; font-size: 12px;">● Online</span></div>
    </a>

    <div id="comment-box" class="comment">Carregando depoimentos...</div>
</div>

<script>
    // Temporizador de 3 minutos
    let time = 180;
    setInterval(() => {
        time--;
        let m = Math.floor(time / 60);
        let s = time % 60;
        document.getElementById('timer').innerText = (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
        if(time <= 0) time = 180;
    }, 1000);

    // Comentários infinitos
    const comments = ["Trampo top, 10% de desconto muito bom!", "O melhor que tem, indico demais!", "Recebi o desconto, valeu Bigode!", "Sem erro, trampo rápido!", "Já fiz 3x e sempre cai na hora."];
    setInterval(() => {
        document.getElementById('comment-box').innerText = comments[Math.floor(Math.random() * comments.length)];
    }, 4000);

    // Nomes aleatórios de compra
    const names = ["João de MG", "Maria do RJ", "Carlos de SP", "Ana de SC", "Pedro do PR"];
    setInterval(() => {
        document.getElementById('live-sale').innerText = names[Math.floor(Math.random() * names.length)] + " acabou de solicitar um trampo!";
    }, 5000);
</script>

</body>
</html>
