<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trampos do Bigode</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #fff; --gray: #a0a0a0; --gold: #b8860b; }
        body { background-color: var(--bg); font-family: sans-serif; color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 450px; width: 100%; }
        .header { text-align: center; margin-bottom: 25px; }
        h1 { margin: 0; font-size: 28px; }
        .banner { background: var(--gold); color: #000; padding: 8px 15px; border-radius: 8px; font-weight: bold; margin: 15px 0; display: inline-block; font-size: 14px; }
        
        /* Grade 2 colunas */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; text-align: center; text-decoration: none; color: white; display: flex; flex-direction: column; align-items: center; border: 1px solid #333; }
        .card:active { opacity: 0.7; transform: scale(0.98); }
        .icon { font-size: 30px; margin-bottom: 10px; }
        h3 { font-size: 14px; margin: 0; }
        
        /* ADM */
        .adm-box { background: var(--card); padding: 15px; border-radius: 15px; margin-top: 20px; display: flex; align-items: center; text-decoration: none; color: white; border: 1px solid #333; }
        .adm-img { width: 50px; height: 50px; border-radius: 50%; margin-right: 15px; object-fit: cover; }
        .status { color: #00e676; font-size: 12px; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Trampos do Bigode</h1>
        <p style="color: var(--gray); font-size: 14px; margin-top: 5px;">Bem vindos aos trampos</p>
        <div class="banner">Confiança gera Conquista</div>
    </div>

    <div class="grid">
        <a href="#" class="card"><div>🏦</div><h3>Contas</h3></a>
        <a href="#" class="card"><div>💳</div><h3>Cartão</h3></a>
        <a href="#" class="card"><div>💰</div><h3>Empréstimo</h3></a>
        <a href="#" class="card"><div>🚫</div><h3>Sem Taxa</h3></a>
        <a href="ifood.html" class="card"><div>🍔</div><h3>Saldo iFood</h3></a>
        <a href="#" class="card"><div>📈</div><h3>Relatórios</h3></a>
    </div>

    <a href="#" class="adm-box">
        <img src="image_4.png" class="adm-img" alt="ADM">
        <div>
            <div style="font-weight: bold;">Falar com ADM</div>
            <div class="status">● Online</div>
        </div>
    </a>
</div>

</body>
</html>
