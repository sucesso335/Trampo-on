<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simular Empréstimo | Trampos do Bigode</title>
    <style>
        :root { --bg: #0a0a0a; --card: #141414; --red: #ff2e2e; --text: #ffffff; --green: #00e676; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { max-width: 400px; width: 100%; background: var(--card); border: 1px solid #333; padding: 25px; border-radius: 20px; }
        
        h1 { font-size: 22px; text-align: center; color: var(--red); margin-bottom: 25px; }
        label { display: block; margin-top: 15px; font-size: 13px; color: #ccc; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #444; background: #000; color: white; }
        
        .btn-simular { width: 100%; background: var(--red); color: white; padding: 15px; border: none; border-radius: 10px; margin-top: 25px; cursor: pointer; font-weight: bold; font-size: 15px; box-shadow: 0 4px 15px rgba(255, 46, 46, 0.3); transition: 0.3s; }
        .btn-simular:disabled { opacity: 0.7; cursor: not-allowed; }
        
        #resultado { margin-top: 25px; padding: 20px; background: #1a1a1a; border-radius: 12px; border: 1px solid #444; display: none; }
        .val-destaque { color: var(--green); font-weight: bold; font-size: 18px; }
        .btn-zap { display:block; text-align:center; background:var(--green); color:black; padding:12px; border-radius:8px; text-decoration:none; font-weight:bold; margin-top:15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Simular Empréstimo</h1>
        
        <label>Valor desejado (R$ 200 a R$ 8.000)</label>
        <input type="number" id="valor" min="200" max="8000" placeholder="Ex: 1000">

        <label>Dia do Vencimento</label>
        <select id="vencimento">
            <option value="05">Dia 05</option>
            <option value="10">Dia 10</option>
            <option value="15">Dia 15</option>
            <option value="20">Dia 20</option>
            <option value="25">Dia 25</option>
        </select>

        <label>Chave PIX para Recebimento</label>
        <input type="text" id="pix" placeholder="Sua chave PIX">

        <label>Parcelas</label>
        <select id="parcelas"></select>

        <button class="btn-simular" id="btn-calc" onclick="simular()">SIMULAR AGORA</button>

        <div id="resultado">
            <p>Valor solicitado: R$ <span id="valSol"></span></p>
            <p>Parcelas: <span id="numParc"></span>x de <span class="val-destaque">R$ <span id="valParc"></span></span></p>
            <p>Vencimento: Todo dia <span id="diaVenc"></span></p>
            <p>Entrada de Garantia (8%): <span class="val-destaque">R$ <span id="valEntrada"></span></span></p>
            <br>
            <p style="font-size: 11px; color: #888;">Para liberar, é necessário pagar a entrada de garantia via PIX.</p>
            <a id="linkPagamento" href="#" class="btn-zap">PAGAR ENTRADA VIA WHATSAPP</a>
        </div>
        <a href="index.html" style="display:block; text-align:center; color:#666; margin-top:20px; font-size: 12px; text-decoration: none;">← Voltar ao início</a>
    </div>

    <script>
        const select = document.getElementById('parcelas');
        for (let i = 1; i <= 24; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.innerHTML = i + 'x';
            select.appendChild(opt);
        }

        function simular() {
            let valor = parseFloat(document.getElementById('valor').value);
            let nParcelas = parseInt(document.getElementById('parcelas').value);
            let diaVenc = document.getElementById('vencimento').value;
            let pix = document.getElementById('pix').value;
            
            if(isNaN(valor) || valor < 200 || valor > 8000) { alert("Valor deve ser entre 200 e 8000"); return; }
            if(pix.trim() === "") { alert("Informe sua chave PIX"); return; }
            
            const btn = document.getElementById('btn-calc');
            btn.innerText = "CALCULANDO...";
            btn.disabled = true;

            setTimeout(() => {
                let valorComJuros = valor * 1.30;
                let valorParcela = valorComJuros / nParcelas;
                let entrada = valor * 0.08;
                
                document.getElementById('valSol').innerText = valor.toFixed(2).replace('.', ',');
                document.getElementById('numParc').innerText = nParcelas;
                document.getElementById('valParc').innerText = valorParcela.toFixed(2).replace('.', ',');
                document.getElementById('valEntrada').innerText = entrada.toFixed(2).replace('.', ',');
                document.getElementById('diaVenc').innerText = diaVenc;
                
                document.getElementById('resultado').style.display = 'block';
                
                let msg = `Olá Bigode! Quero liberar um empréstimo de R$ ${valor.toFixed(2)}. Escolhi ${nParcelas}x de R$ ${valorParcela.toFixed(2)} com vencimento dia ${diaVenc}. O valor da entrada (8%%) é R$ ${entrada.toFixed(2)}. Minha chave PIX é: ${pix}. Como faço o pagamento da entrada?`;
                document.getElementById('linkPagamento').href = "https://wa.me/5532987194791?text=" + encodeURIComponent(msg);
                
                btn.innerText = "SIMULAR AGORA";
                btn.disabled = false;
            }, 1500);
        }
    </script>
</body>
</html>
