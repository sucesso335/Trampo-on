<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saldo iFood | Equipe da Sorte</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --red: #ff0000; --bg: #050505; --card: #0f0f0f; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 450px; width: 100%; }

        .header-box { text-align: center; padding: 20px 0; }
        .tag { background: rgba(255,0,0,0.1); color: var(--red); padding: 6px 15px; border-radius: 20px; font-size: 11px; font-weight: 800; border: 1px solid var(--red); }
        h1 { font-size: 32px; margin: 15px 0 5px; }

        .main-card { background: var(--card); border: 1px solid #222; border-radius: 24px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input[type=range] { width: 100%; accent-color: var(--red); margin: 25px 0; }
        .val-display { text-align: center; font-size: 45px; font-weight: 800; color: var(--red); }
        
        .promo-banner { background: var(--red); padding: 15px; border-radius: 16px; text-align: center; margin-bottom: 20px; font-weight: 800; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .resumo-box { background: #161616; border-radius: 16px; padding: 20px; margin: 20px 0; border: 1px solid #333; }
        .row { display: flex; justify-content: space-between; margin-bottom: 10px; color: #aaa; }
        .row.total { color: #fff; font-size: 18px; font-weight: 700; border-top: 1px solid #333; padding-top: 15px; }

        .cta-btn { display: block; background: linear-gradient(135deg, #ff0000, #a00000); color: #fff; padding: 20px; text-align: center; border-radius: 20px; font-weight: 800; font-size: 18px; text-decoration: none; }
        
        .estoque-box { text-align: center; font-size: 13px; color: #fff; background: #161616; padding: 15px; border-radius: 16px; border: 1px solid var(--red); margin: 20px 0; }
        
        /* Estilo dos Depoimentos */
        .depoimento { background: #161616; border: 1px solid #333; padding: 15px; border-radius: 16px; margin-top: 15px; }
        .depoimento-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .depoimento-nome { font-weight: bold; font-size: 14px; }
        .depoimento-data { font-size: 11px; color: #666; }
        .depoimento-texto { font-size: 13px; color: #bbb; }
        
        footer { text-align: center; font-size: 10px; color: #444; margin-top: 30px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <div class="tag">Equipe da Sorte - Painel Oficial</div>
        <h1>SALDO IFOOD</h1>
    </div>

    <div class="promo-banner">
        🚀 PROMOÇÃO DE HOJE: Ganhe bônus extra nas compras acima de R$ 150!
    </div>

    <div class="main-card">
        <input type="range" id="range" min="50" max="200" step="50" value="100" oninput="update()">
        <div class="val-display" id="v-saldo">R$ 100</div>

        <div class="resumo-box">
            <div class="row"><span>Status</span><span style="color:#00ff00;">Verificado</span></div>
            <div class="row total"><span>Valor a Pagar</span><span id="v-pagar">R$ 60</span></div>
        </div>

        <a href="#" id="link-whats" class="cta-btn">COMPRAR AGORA</a>
    </div>

    <div class="estoque-box">
        ⚠ <strong>ESTOQUE LIMITADO:</strong> Restam apenas <span id="contador" style="color: var(--red);">12</span> unidades hoje.
    </div>

    <!-- Área de Depoimentos Dinâmicos -->
    <div style="margin-top: 25px;">
        <h3 style="text-align: center; font-size: 14px; color: #888;">Clientes Satisfeitos</h3>
        <div id="area-depoimentos"></div>
    </div>

    <footer>© 2026 Equipe da Sorte. Todos os direitos reservados.</footer>
</div>

<script>
    // Listas para gerar conteúdo variado
    const nomes = ["João Silva", "Ana Souza", "Pedro Henrique", "Lucas Oliveira", "Mariana Costa", "Gabriel Santos", "Fernanda Lima", "Ricardo Alves", "Beatriz Rocha"];
    const textos = ["Saldo caiu na hora, muito ágeis!", "Tudo certo, recomendo a Equipe da Sorte.", "Comprei o de 200, entrega super rápida. Confiança total!", "Melhor grupo de saldos do momento!", "Atendimento excelente, nota 10!", "Já é a segunda vez que compro, sempre funciona.", "Top, recomendo muito!"];
    const tempos = ["há 2 horas", "há 5 horas", "há 10 min", "há 30 min", "há 1 hora", "há 4 horas"];

    function carregarDepoimentos() {
        let container = document.getElementById('area-depoimentos');
        container.innerHTML = ''; 
        
        for(let i = 0; i < 3; i++) {
            let n = nomes[Math.floor(Math.random() * nomes.length)];
            let t = textos[Math.floor(Math.random() * textos.length)];
            let tempo = tempos[Math.floor(Math.random() * tempos.length)];
            
            container.innerHTML += `
                <div class="depoimento">
                    <div class="depoimento-header">
                        <span class="depoimento-nome">✅ ${n}</span>
                        <span class="depoimento-data">${tempo}</span>
                    </div>
                    <p class="depoimento-texto">"${t}"</p>
                </div>
            `;
        }
    }

    function update() {
        let s = document.getElementById('range').value;
        let p = s * 0.6; 
        document.getElementById('v-saldo').innerText = 'R$ ' + s;
        document.getElementById('v-pagar').innerText = 'R$ ' + p.toFixed(2);
        document.getElementById('link-whats').href = `https://wa.me/5532987252649?text=Quero%20comprar%20o%20Saldo%20iFood%20de%20R$${s}%20pagando%20R$${p.toFixed(2)}`;
    }
    
    carregarDepoimentos();
    let estoque = 12;
    document.getElementById('contador').innerText = estoque;
    update();
</script>

</body>
</html>
