<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saldo Lanche | Pagamento</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #050505; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 400px; width: 100%; }
        
        /* Header */
        .header { text-align: center; margin-bottom: 20px; }
        .badge { background: #ff0000; padding: 5px 15px; border-radius: 20px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        h1 { margin: 15px 0 5px; font-size: 28px; }
        
        /* Card Principal */
        .card { background: #111; border: 1px solid #333; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .resumo-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .valor-total { color: #ff0000; font-size: 24px; font-weight: bold; }
        
        /* Botão */
        .btn-comprar { 
            background: #ff0000; color: white; text-align: center; padding: 18px; 
            border-radius: 15px; text-decoration: none; font-weight: bold; display: block; 
            font-size: 16px; box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }
        
        /* Estoque */
        .estoque { margin-top: 20px; text-align: center; font-size: 12px; color: #888; }
        .barra { background: #333; height: 6px; border-radius: 3px; margin-top: 8px; overflow: hidden; }
        .progresso { background: #ff0000; width: 37%; height: 100%; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="badge">🛍️ Saldo Lanche</div>
        <h1>SALDO LANCHE</h1>
        <p style="color: #aaa;">Mais sabor. Mais economia. Mais você.</p>
    </div>

    <div class="card">
        <h3 style="font-size: 14px; margin-bottom: 15px;">2. RESUMO DO PEDIDO</h3>
        <div class="resumo-item">
            <span>Saldo Lanche</span>
            <span>R$ 200,00</span>
        </div>
        <hr style="border: 0; border-top: 1px dashed #333; margin: 10px 0;">
        <div class="resumo-item">
            <span>Valor a pagar</span>
            <span class="valor-total">R$ 120,00</span>
        </div>
        <div style="margin-top: 15px; font-size: 11px; color: #555; text-align: center;">
            🔒 Pagamento 100% seguro • Dados protegidos
        </div>
    </div>

    <a href="https://wa.me/5532987194791?text=Quero%20comprar%20o%20Saldo%20Lanche%20de%20R$%20200" class="btn-comprar">
        COMPRAR AGORA
    </a>

    <div class="estoque">
        ⚠ ESTOQUE ESGOTANDO! Restam poucas unidades hoje.
        <div class="barra"><div class="progresso"></div></div>
    </div>
</div>

</body>
</html>
