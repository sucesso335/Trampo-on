<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja Digital</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
background:linear-gradient(135deg,#000,#1a0000,#b30000);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:#fff;
}
.card{
width:100%;
max-width:420px;
background:#111;
border:1px solid #ff2d2d;
border-radius:22px;
padding:25px;
box-shadow:0 0 30px rgba(255,0,0,.25);
}
h1{
text-align:center;
color:#ff3b3b;
margin-bottom:10px;
}
.sub{
text-align:center;
color:#ddd;
margin-bottom:25px;
}
.valor{
text-align:center;
font-size:42px;
font-weight:bold;
color:#fff;
margin:20px 0;
}
input[type=range]{width:100%;}
.box{
background:#1b1b1b;
padding:18px;
border-radius:15px;
margin-top:20px;
}
.linha{
display:flex;
justify-content:space-between;
margin:12px 0;
font-size:18px;
}
button{
width:100%;
margin-top:25px;
padding:16px;
background:#ff2d2d;
border:none;
border-radius:14px;
color:#fff;
font-size:19px;
font-weight:bold;
cursor:pointer;
transition:.25s;
}
button:hover{
transform:scale(1.02);
}
.rodape{
text-align:center;
margin-top:18px;
color:#aaa;
font-size:14px;
}
</style>
</head>
<body>

<div class="card">

<h1>Loja Digital</h1>
<p class="sub">Escolha o valor desejado</p>

<div class="valor" id="valor">R$ 50</div>

<input id="slider" type="range" min="50" max="200" step="50" value="50">

<div class="box">
<div class="linha">
<span>Valor escolhido</span>
<b id="gift">R$ 50</b>
</div>

<div class="linha">
<span>Valor a pagar</span>
<b id="pagar">R$ 30</b>
</div>
</div>

<button onclick="window.location.href='https://wa.me/5532987194791'">
Comprar Agora
</button>

<div class="rodape">
Atendimento via WhatsApp • Entrega digital
</div>

</div>

<script>
const slider=document.getElementById("slider");

function atualizar(){
const v=parseInt(slider.value);
document.getElementById("valor").textContent="R$ "+v;
document.getElementById("gift").textContent="R$ "+v;
document.getElementById("pagar").textContent="R$ "+(v*0.6);
}
slider.oninput=atualizar;
atualizar();
</script>

</body>
</html>
