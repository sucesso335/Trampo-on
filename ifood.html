<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saldo iFood | Painel Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --red: #ff0000; --bg: #050505; --card: #0f0f0f; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 450px; width: 100%; }

        .header-box { text-align: center; padding: 20px 0; }
        .tag { background: rgba(255,0,0,0.1); color: var(--red); padding: 6px 15px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; border: 1px solid var(--red); }
        h1 { font-size: 32px; margin: 15px 0 5px; }

        .main-card { background: var(--card); border: 1px solid #222; border-radius: 24px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input[type=range] { width: 100%; height: 8px; background: #222; border-radius: 5px; outline: none; accent-color: var(--red); margin: 25px 0; }
        .val-display { text-align: center; font-size: 50px; font-weight: 800; color: var(--red); margin: 10px 0; }
        
        .resumo-box { background: #161616; border-radius: 16px; padding: 20px; margin: 20px 0; border: 1px solid #333; }
        .row { display: flex; justify-content: space-between; margin-bottom: 10px; color: #aaa; }
        .row.total { color: #fff; font-size: 18px; font-weight: 700; border-top: 1px solid #333; padding-top: 15px; margin-top: 10px; }

        .cta-btn { display: block; background: linear-gradient(135deg, #ff0000, #a00000); color: #fff; padding: 20px; text-align: center; border-radius: 20px; font-weight: 800; font-size: 18px; text-decoration: none; box-shadow: 0 8px 20px rgba(255,0,0,0.3); transition: transform 0.2s; }
        
        .estoque-box { margin-top: 25px; text-align: center; font-size: 12px; color: #888; }
        .barra { background: #222; height: 6px; border-radius: 3px; margin-top: 8px; overflow: hidden; }
        .progresso { background: var(--red); width: 37%; height: 100%; }

        .notificacao { background: #161616; border: 1px solid #333; padding: 15px; border-radius: 16px; margin-top: 25px; display: flex; align-items: center; gap: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <div class="tag">Sistema Oficial</div>
        <h1>SALDO IFOOD</h1>
    </div>

    <div class="main-card">
        <div style="text-align: center; font-weight: 600;">Selecione o valor desejado:</div>
        <input type="range" id="range" min="50" max="200" step="50" value="100" oninput="update()">
        <div class="val-display" id="v-saldo">R$ 100</div>

        <div class="resumo-box">
            <div class="row"><span>Status</span><span style="color:#00ff00;">Disponível</span></div>
            <div class="row total"><span>Valor a Pagar</span><span id="v-pagar">R$ 60</span></div>
        </div>

        <a href="#" id="link-whats" class="cta-btn">COMPRAR AGORA</a>
    </div>

    <div class="estoque-box">
        ⚠ ESTOQUE ESGOTANDO! Restam poucas unidades hoje.
        <div class="barra"><div class="progresso"></div></div>
    </div>

    <div class="notificacao">
        <div style="font-size: 24px;">👤</div>
        <div>
            <strong>Lucas Silva</strong> acabou de comprar<br>
            <span style="color: var(--red); font-size: 12px;">Saldo iFood de R$ 150</span>
        </div>
    </div>
</div>

<script>
    function update() {
        let s = document.getElementById('range').value;
        // Ajuste a taxa aqui (ex: 0.6 é 60%)
        let p = s * 0.6; 
        document.getElementById('v-saldo').innerText = 'R$ ' + s;
        document.getElementById('v-pagar').innerText = 'R$ ' + p.toFixed(2);
        document.getElementById('link-whats').href = `https://wa.me/5532987194791?text=Quero%20comprar%20o%20Saldo%20iFood%20de%20R$${s}%20pagando%20R$${p.toFixed(2)}`;
    }
    update();
</script>

</body>
</html>
