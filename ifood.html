<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Saldo</title>
    <style>
        body { background-color: #050505; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { max-width: 400px; width: 100%; }
        .card { background: #161616; border: 1px solid #333; border-radius: 20px; padding: 25px; margin-bottom: 20px; }
        
        /* Simulador Visual */
        input[type=range] { width: 100%; accent-color: #ff0000; margin: 20px 0; }
        .price-display { text-align: center; font-size: 40px; font-weight: bold; color: #ff0000; margin: 10px 0; }
        .resumo { border-top: 1px solid #333; padding-top: 15px; margin-top: 15px; }
        
        .btn-comprar { display: block; background: #ff0000; color: white; padding: 18px; text-align: center; border-radius: 15px; text-decoration: none; font-weight: bold; font-size: 18px; }
        
        .estoque-box { margin-top: 20px; text-align: center; font-size: 12px; color: #888; }
        .barra { background: #333; height: 6px; border-radius: 3px; margin-top: 8px; }
        .progresso { background: #ff0000; width: 37%; height: 100%; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 style="text-align: center;">Simulador de Saldo</h2>
        <input type="range" id="range" min="50" max="200" step="50" value="100" oninput="atualizar()">
        
        <div class="price-display" id="valor-saldo">R$ 100</div>
        
        <div class="resumo">
            <p>Valor a pagar: <strong id="valor-pagar" style="color: #ff0000; font-size: 20px;">R$ 60</strong></p>
        </div>
    </div>

    <a href="#" id="link-whats" class="btn-comprar">COMPRAR AGORA</a>

    <div class="estoque-box">
        ⚠ ESTOQUE ESGOTANDO! Restam poucas unidades hoje.
        <div class="barra"><div class="progresso"></div></div>
    </div>
</div>

<script>
    function atualizar() {
        let saldo = document.getElementById('range').value;
        // Lógica: Se 100 paga 60, 50 paga 30, 200 paga 120 (proporção de 60%)
        let pagar = saldo * 0.6; 
        
        document.getElementById('valor-saldo').innerText = 'R$ ' + saldo;
        document.getElementById('valor-pagar').innerText = 'R$ ' + pagar;
        
        let link = "https://wa.me/5532987194791?text=Quero%20comprar%20o%20saldo%20de%20R$%20" + saldo + "%20pagando%20R$%20" + pagar;
        document.getElementById('link-whats').href = link;
    }
    // Iniciar com valores padrão
    atualizar();
</script>

</body>
</html>
